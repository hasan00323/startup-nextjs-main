<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140" role="img" aria-label="Future Dev logo dark">
  <!-- Icon -->
  <g transform="translate(20,18)">
    <!-- dark container -->
    <rect x="0" y="0" width="104" height="104" rx="22" fill="#0B1020"></rect>

    <!-- right shape (lighter blue) -->
    <path d="M56 84 V26
         A44 44 0 0 1 100 70
         V84
         Q100 92 92 92
         H64
         Q56 92 56 84 Z" fill="#6C7CFF"></path>

    <!-- left shape (primary glow) -->
    <path d="M24 84 V26
         A58 58 0 0 1 82 84
         H24 Z" fill="#4C6FFF"></path>
  </g>

  <!-- Wordmark -->
  <g transform="translate(150,0)">
    <text x="0" y="86" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="54" font-weight="700" letter-spacing="0.2px" fill="#F8FAFC">
      Future <tspan fill="#4C6FFF">Dev</tspan>
    </text>

    <!-- tagline (optional) -->
    <text x="2" y="112" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" font-weight="500" fill="#94A3B8">
      Build • Ship • Improve
    </text>
  </g>
</svg>
